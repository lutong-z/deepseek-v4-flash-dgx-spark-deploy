[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgx-spark-deepseek-v4-deploy"
version = "0.1.0"
description = "Dry-run contracts and safe command rendering for two-node DGX Spark deployment"
requires-python = ">=3.11"

[project.scripts]
dgx-deploy = "dgx_deploy.cli:main"

[tool.setuptools.packages.find]
include = ["dgx_deploy*"]

[tool.pytest.ini_options]
addopts = "-q"
